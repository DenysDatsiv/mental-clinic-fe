<div class="tgrid" [formGroup]="searchForm">

  <!-- Search + filters bar -->
  <div class="tgrid__toolbar">
    <div class="tgrid__search">
      <svg class="tgrid__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="tgrid__search-input" formControlName="text"
             placeholder="Пошук тестування..." type="text" autocomplete="off"/>
      <button *ngIf="searchForm.get('text')?.value"
              class="tgrid__search-clear"
              (click)="searchForm.patchValue({ text: '' })" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="tgrid__chips">
      <button *ngFor="let cat of categories"
              class="tgrid__chip"
              [class.tgrid__chip--active]="isActiveCategory(cat)"
              (click)="selectCategory(cat)"
              type="button">
        {{ cat.name }}
      </button>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="loading$ | async" class="tgrid__loading">
    <p-progressSpinner strokeWidth="3" animationDuration="0.8s"></p-progressSpinner>
  </div>

  <!-- Cards grid -->
  <ng-container *ngIf="!(loading$ | async)">
    <div *ngIf="(tests$ | async)?.length > 0; else noTests" class="tgrid__grid">
      <app-card *ngFor="let test of tests$ | async" [testData]="test"/>
    </div>
  </ng-container>

  <ng-template #noTests>
    <div class="tgrid__empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" width="40" height="40">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <p>За вашим запитом нічого не знайдено</p>
      <button class="tgrid__reset" (click)="resetSearch()" type="button">Скинути пошук</button>
    </div>
  </ng-template>

</div>
