<div class="surface-section px-4 py-8 md:px-6 lg:px-8">
    <div class="text-700 text-center">
        <div class="tg-powered font-bold mb-3">
            <i class="pi pi-telegram"></i>&nbsp;POWERED BY TELEGRAM
        </div>

        <div class="text-900 font-bold text-5xl mb-3">
            Доєднуйся до нашої телеграм спільноти
        </div>

        <div class="text-700 text-2xl mb-5">
            Ви можете ставити питання доказовим психіатрам, психологам і отримувати відповіді на свої запитання
        </div>

        <div class="telegram-buttons">
            <button
                    (click)="openTelegram(TELEGRAM_BANNER.PSYCHOLOGIST_CHAT.name, TELEGRAM_BANNER.PSYCHOLOGIST_CHAT.link)"
                    class="font-bold px-5 py-3 p-button-raised p-button-rounded"
                    icon="pi pi-telegram"
                    [label]="TELEGRAM_BANNER.PSYCHOLOGIST_CHAT.name"
                    pButton
                    pRipple>
            </button>

            <button
                    (click)="openTelegram(TELEGRAM_BANNER.PSYCHIATRIST_CHAT.name, TELEGRAM_BANNER.PSYCHIATRIST_CHAT.link)"
                    class="font-bold px-5 py-3 p-button-raised p-button-rounded"
                    icon="pi pi-telegram"
                    [label]="TELEGRAM_BANNER.PSYCHIATRIST_CHAT.name"
                    pButton
                    pRipple>
            </button>
        </div>
    </div>
</div>
