<div class="landing-outer">
  <div class="landing-wrapper" id="home">

    <app-hero-banner></app-hero-banner>

    <app-doctor-info-strip></app-doctor-info-strip>

    <app-no-fear-block></app-no-fear-block>

    <app-testing-block [id]='SECTION.TEST'>
      <app-test-block></app-test-block>
    </app-testing-block>

    <app-consultation-block></app-consultation-block>

    <div class="contract-section">
      <div class="contract-callout">
        <div class="contract-callout__icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <div class="contract-callout__body">
          <h3 class="contract-callout__title">Публічний договір</h3>
          <p class="contract-callout__text">
            Перш ніж записатися на консультацію, будь ласка, ознайомтеся з умовами надання послуг.
            Запис на прийом означає вашу згоду з положеннями публічного договору.
          </p>
          <a class="contract-callout__link" [routerLink]="ROUTES.CONTRACT">
            Читати публічний договір
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </a>
        </div>
      </div>
    </div>

    <app-telegram-banner></app-telegram-banner>

  </div>
</div>
